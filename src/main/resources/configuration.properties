# Application name and title
application.name=MailBox
application.title=MailBox Desktop
application.tagline=Capture. Preview. Inspect.
application.description=Local Email Testing & Inspection Studio
application.product.code=MAILBOX

# Application default size
application.min.height=640
application.min.width=960

# Application icon
application.icon.path=/icon.png

# Emails extension
emails.suffix=.eml

# Logback custom SMTP appender name, for redirecting logs through the application
logback.appender.name=SMTPLOGS

# Default SMTP port
smtp.default.port=25

# Minimize to system tray, if supported by OS
# Currently disabled, see https://github.com/Nilhcem/FakeSMTP/pull/30 https://github.com/Nilhcem/FakeSMTP/pull/35
application.tray.use=false
